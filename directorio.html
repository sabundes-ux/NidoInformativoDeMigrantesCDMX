<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio | NIM</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/tablas.css">
  <link rel="stylesheet" href="./css/directorio.css">  
</head>

<body>
  <header id="main-header">
    <nav>
      <ul class="menu">
        <li><a href="index.html">NIM</a></li>
        <li><a href="mapbox.html">Mapa</a></li>
        <li><a href="directorio.html">Directorio</a></li>
        <li><a href="acerca-de.html">Acerca de:</a></li>
      </ul>
    </nav>
  </header>
  <main>

    <h1>Directorio NIM</h1>

    <form class="filtro-form" id="filtroForm">
      <label>
        Categoría
        <select id="selectCategoria">
          <option value="">— Todas —</option>
          <option value="comedores">Comedores</option>
          <option value="albergues">Albergues</option>
          <option value="juridico">Acompañamiento Jurídico</option>
          <option value="violencia-sexual">Violencia Sexual</option>
          <option value="instituciones-publicas">Instituciones Públicas</option>
        </select>
      </label>

      <label>
        Alcaldía
        <select id="selectAlcaldia">
          <option value="">— Todas —</option>
          <option value="Álvaro Obregón">Álvaro Obregón</option>
          <option value="Azcapotzalco">Azcapotzalco</option>
          <option value="Benito Juárez">Benito Juárez</option>
          <option value="Coyoacán">Coyoacán</option>
          <option value="Cuajimalpa de Morelos">Cuajimalpa de Morelos</option>
          <option value="Cuauhtémoc">Cuauhtémoc</option>
          <option value="Gustavo A. Madero">Gustavo A. Madero</option>
          <option value="Iztacalco">Iztacalco</option>
          <option value="Iztapalapa">Iztapalapa</option>
          <option value="La Magdalena Contreras">La Magdalena Contreras</option>
          <option value="Miguel Hidalgo">Miguel Hidalgo</option>
          <option value="Milpa Alta">Milpa Alta</option>
          <option value="Tláhuac">Tláhuac</option>
          <option value="Tlalpan">Tlalpan</option>
          <option value="Venustiano Carranza">Venustiano Carranza</option>
          <option value="Xochimilco">Xochimilco</option>
        </select>
      </label>

      <button type="submit" class="btn-buscar">Buscar</button>
    </form>

    <div id="resultados"></div>

  </main>
  <script src="js/markers.js"></script>
  <script>
    var form = document.getElementById('filtroForm');
    var contenedor = document.getElementById('resultados');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var catFiltro = document.getElementById('selectCategoria').value;
      var alcaldiaFiltro = document.getElementById('selectAlcaldia').value;

      var features = window.NIM_MAPBOX_DATA.geojson.features.filter(function (f) {
        var p = f.properties;
        var okCat = !catFiltro || p.category === catFiltro;
        var okAlcaldia = !alcaldiaFiltro || p.borough === alcaldiaFiltro;
        return okCat && okAlcaldia;
      });

      contenedor.innerHTML = '';

      if (features.length === 0) {
        contenedor.innerHTML = '<p class="sin-resultados">No se encontraron resultados para los filtros seleccionados.</p>';
        return;
      }

      var grupos = {};
      features.forEach(function (f) {
        var cat = f.properties.categoryLabel || f.properties.category;
        if (!grupos[cat]) grupos[cat] = [];
        grupos[cat].push(f.properties);
      });

      Object.keys(grupos).forEach(function (catLabel) {
        var spots = grupos[catLabel];
        var seccion = document.createElement('div');
        seccion.className = 'resultados-categoria';

        var filas = spots.map(function (p) {
          var telefono = p.phone
            ? '<a href="' + (p.phoneHref || 'tel:' + p.phone) + '" target="_blank">' + p.phone + '</a>'
            : '—';
          var mapa = p.mapsUrl
            ? '<a href="' + p.mapsUrl + '" target="_blank">Ver mapa</a>'
            : '—';
          return '<tr>'
            + '<td>' + (p.name || '—') + '</td>'
            + '<td>' + (p.borough || '—') + '</td>'
            + '<td>' + (p.schedule || '—') + '</td>'
            + '<td>' + telefono + '</td>'
            + '<td>' + mapa + '</td>'
            + '</tr>';
        }).join('');

        seccion.innerHTML =
          '<h2>' + catLabel + '</h2>'
          + '<span class="total-badge">' + spots.length + ' resultado' + (spots.length !== 1 ? 's' : '') + '</span>'
          + '<table class="dir-table">'
          + '<thead><tr>'
          + '<th>Nombre del lugar</th>'
          + '<th>Alcaldía</th>'
          + '<th>Horario</th>'
          + '<th>Teléfono</th>'
          + '<th>Google Maps</th>'
          + '</tr></thead>'
          + '<tbody>' + filas + '</tbody>'
          + '</table>';

        contenedor.appendChild(seccion);
      });
    });
  </script>

</body>

</html>
