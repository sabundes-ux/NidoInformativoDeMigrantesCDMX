name: Inject Mapbox token and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MAPBOX_TOKEN Secret
        run: |
          if [ -z "${{ secrets.MAPBOX_TOKEN }}" ]; then
            echo "ERROR: MAPBOX_TOKEN secret is not set!"
            exit 1
          else
            echo "✓ MAPBOX_TOKEN secret is configured"
          fi

      - name: Generate Mapbox secret file
        run: |
          mkdir -p js
          cat > js/secrets.js << 'EOF'
window.MAPBOX_TOKEN = "${{ secrets.MAPBOX_TOKEN }}";
window.WARNING_MESSAGE = 'Please Provide a Mapbox Token in order to use Kepler.gl. Edit this repository secret MAPBOX_TOKEN with your access key';
EOF
          echo "✓ secrets.js created with content:"
          head -5 js/secrets.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
